# Runs on every push and pull request: builds the GHDL image, runs all
# pytest tests against real Docker (nothing skipped), then starts the API
# and runs the live HTTP check. A red X on a PR means something broke.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build the GHDL image
        run: docker build -t p5a-ghdl ./docker

      - name: Unit, limit and integration tests
        run: python -m pytest -v -rs

      - name: Live API check
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          python docker/m4_api_check.py http://127.0.0.1:8000
